<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ event.title }}</title>
    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: #f4f4f4;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 1rem;
        }

        .content-container {
            background: #ffffff;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: #555;
        }

        p {
            font-size: 1rem;
            margin: 0.5rem 0;
        }

        strong {
            color: #444;
        }

        a button {
            padding: 0.8rem 1.5rem;
            background: #0ed32f;
            border: none;
            border-radius: 5px;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease;
            margin: 0.5rem;
        }

        a button:hover {
            background: #57d9c1;
        }

        .button-container {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="content-container">
        <h1>{{ event.title }}</h1>
        <p><strong>Opis:</strong> {{ event.description }}</p>
        <p><strong>Czas rozpocznięcia:</strong> {{ event.start_time|date:"Y-m-d H:i" }}</p>
        <p><strong>Czas zakończenia:</strong> {{ event.end_time|date:"Y-m-d H:i" }}</p>

        <div class="button-container">
            <a href="/">
                <button type="button">Powrót</button>
            </a>

            <a href="{% url 'edit_event' event.id %}">
                <button type="button">Edytuj wydarzenie</button>
            </a>

            <a href="{% url 'delete_event' event.id %}">
                <button type="button">Usuń wydarzenie</button>
            </a>
        </div>
    </div>
</body>
</html>
